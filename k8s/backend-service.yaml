apiVersion: v1
kind: Service
metadata:
  name: hify-backend
  labels:
    app.kubernetes.io/name: hify-backend
    app.kubernetes.io/part-of: hify
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hify-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
