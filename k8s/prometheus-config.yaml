apiVersion: v1
kind: ConfigMap
metadata:
  name: hify-prometheus-config
  labels:
    app.kubernetes.io/name: hify-prometheus
    app.kubernetes.io/part-of: hify
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: hify
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: ['hify-backend:8080']
