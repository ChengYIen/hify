apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-backend
  labels:
    app.kubernetes.io/name: hify-backend
    app.kubernetes.io/part-of: hify
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hify-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hify-backend
        app.kubernetes.io/part-of: hify
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: hify-backend:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: hify-config
            - secretRef:
                name: hify-secret
          volumeMounts:
            - name: upload
              mountPath: /var/lib/hify/upload
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: hify-upload
