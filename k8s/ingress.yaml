apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hify
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hify.example.internal
      secretName: hify-tls
  rules:
    - host: hify.example.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hify-backend
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hify-frontend
                port:
                  name: http
