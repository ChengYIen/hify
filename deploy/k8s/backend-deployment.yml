apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-backend
  namespace: hify
  labels:
    app: hify-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hify-backend
  template:
    metadata:
      labels:
        app: hify-backend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          # 本地构建用唯一标签，避免 containerd 命中旧 digest 缓存。
          image: hify-backend:v20260819e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: hify-backend-config
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hify-backend-secret
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hify-backend-secret
                  key: REDIS_PASSWORD
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hify-backend-secret
                  key: PGVECTOR_PASSWORD
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hify-backend-secret
                  key: OPENAI_API_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: uploads
              mountPath: /var/lib/hify/upload
      volumes:
        - name: uploads
          emptyDir: {}
