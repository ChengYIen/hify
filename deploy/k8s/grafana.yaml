---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-grafana
  namespace: hify
  labels:
    app: hify-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hify-grafana
  template:
    metadata:
      labels:
        app: hify-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 3000
          env:
            # 首次登录默认 admin/admin，生产环境请改为 Secret 注入。
            - name: GF_SECURITY_ADMIN_USER
              value: admin
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: web
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: provisioning
          configMap:
            name: hify-grafana-provisioning
        - name: dashboards
          configMap:
            name: hify-grafana-dashboard
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hify-grafana
  namespace: hify
  labels:
    app: hify-grafana
spec:
  type: NodePort
  selector:
    app: hify-grafana
  ports:
    - name: web
      port: 3000
      targetPort: web
      nodePort: 30030
