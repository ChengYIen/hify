apiVersion: v1
kind: ServiceAccount
metadata:
  name: hify-prometheus
  namespace: hify
  labels:
    app: hify-prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hify-prometheus
  namespace: hify
  labels:
    app: hify-prometheus
rules:
  - apiGroups: [""]
    resources: ["endpoints", "pods", "services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hify-prometheus
  namespace: hify
  labels:
    app: hify-prometheus
subjects:
  - kind: ServiceAccount
    name: hify-prometheus
    namespace: hify
roleRef:
  kind: Role
  name: hify-prometheus
  apiGroup: rbac.authorization.k8s.io
