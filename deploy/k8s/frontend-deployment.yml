apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-frontend
  namespace: hify
  labels:
    app: hify-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hify-frontend
  template:
    metadata:
      labels:
        app: hify-frontend
    spec:
      containers:
        - name: frontend
          image: hify-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
