apiVersion: v1
kind: Service
metadata:
  name: hify-backend
  namespace: hify
  labels:
    app: hify-backend
spec:
  type: ClusterIP
  selector:
    app: hify-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: hify
  labels:
    app: hify-backend
spec:
  type: ClusterIP
  selector:
    app: hify-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 8081
      targetPort: metrics
