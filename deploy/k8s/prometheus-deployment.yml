apiVersion: apps/v1
kind: Deployment
metadata:
  name: hify-prometheus
  namespace: hify
  labels:
    app: hify-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hify-prometheus
  template:
    metadata:
      labels:
        app: hify-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: rules
              mountPath: /etc/prometheus/rules
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: hify-prometheus-config
        - name: rules
          configMap:
            name: hify-prometheus-alerts
        - name: data
          persistentVolumeClaim:
            claimName: hify-prometheus-data
