spring:
  datasource:
    mysql:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:hify;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password:
    postgresql:
      driver-class-name: org.h2.Driver
      jdbc-url: jdbc:h2:mem:hify_pg;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
      username: sa
      password:
  data:
    redis:
      host: localhost
      port: 6379
      database: 1
      password:
  sql:
    init:
      mode: always
      schema-locations: classpath:sql/schema-mock.sql
      continue-on-error: false

server:
  port: 0
