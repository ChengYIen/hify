# ======================== 公共配置 + 默认值 ========================
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # --- 数据源：MySQL（业务数据） ---
  datasource:
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/hify?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      username: ${MYSQL_USER:root}
      password: ${MYSQL_PASSWORD:}
    # --- 数据源：PostgreSQL（向量数据） ---
    postgresql:
      driver-class-name: org.postgresql.Driver
      jdbc-url: jdbc:postgresql://${PG_HOST:localhost}:5432/hify
      username: ${PG_USER:hify}
      password: ${PG_PASSWORD:}

  # --- Redis ---
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2

  # --- 文件上传 ---
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # --- Flyway（数据库迁移） ---
  flyway:
    enabled: false

# ======================== MyBatis-Plus ========================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# ======================== 服务端口 ========================
server:
  port: ${SERVER_PORT:8080}

# ======================== Actuator 健康检查 ========================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

# ======================== Hify 业务配置 ========================
hify:
  llm:
    timeout:
      connect: 10s
      read: 60s
      write: 30s
      total: 90s
    retry:
      max-attempts: 3
      initial-delay: 1000
      max-delay: 30000
      multiplier: 2.0
      jitter: 0.3
    agent:
      max-iterations: 10
      total-timeout: 90s
    tool:
      timeout: 30s

# ======================== Resilience4j 熔断 ========================
resilience4j:
  circuitbreaker:
    configs:
      llm-default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - java.net.ConnectException
          - java.io.IOException
    instances:
      openai:
        base-config: llm-default
      claude:
        base-config: llm-default
      gemini:
        base-config: llm-default
      ollama:
        base-config: llm-default
